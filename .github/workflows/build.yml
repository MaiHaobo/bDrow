name: Build bDrow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo "=== 可用 SDK ==="
          xcodebuild -showsdks

      - name: Build archive (unsigned)
        run: |
          xcodebuild \
            -project bDrow.xcodeproj \
            -scheme bDrow \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/bDrow.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -e
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R "bDrow.xcarchive/Products/Applications/bDrow.app" Payload/
          zip -qr bDrow-unsigned.ipa Payload
          ls -lh bDrow-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bDrow-unsigned-ipa
          path: ${{ runner.temp }}/bDrow-unsigned.ipa
          retention-days: 30
